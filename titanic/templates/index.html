<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Titanic Survival Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Titanic Survival Prediction using ML">
    <meta name="author" content="John Doe">
    <link rel="stylesheet" href="{{ url_for('static', filename='mystylesheet.css') }}">
    <style>
        /* Accessibility improvement */
        input:focus, select:focus, button:focus {
            outline: 2px solid #28a745;
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <div class="image-container">
        <div class="ripple-wrapper">
            <img src="{{ url_for('static', filename='Titanic.jpeg') }}" alt="Titanic Iceberg" class="background-img">
            <div class="ripple"></div>
        </div>
    </div>

    <div class="container">
        <h2>Will this passenger survive?</h2>

        <form method="POST" action="/predict">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter passenger's name" required>
            </div>

            <div class="form-group">
                <label for="pclass">Passenger Class (1, 2, 3):</label>
                <input type="number" id="pclass" name="pclass" min="1" max="3" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" step="any" min="0" placeholder="Enter age" required>
            </div>

            <div class="form-group">
                <label for="sibsp">Siblings/Spouses Aboard:</label>
                <input type="number" id="sibsp" name="sibsp" min="0" required>
            </div>

            <div class="form-group">
                <label for="parch">Parents/Children Aboard:</label>
                <input type="number" id="parch" name="parch" min="0" required>
            </div>

            <div class="form-group">
                <label for="fare">Fare:</label>
                <input type="number" id="fare" name="fare" step="any" min="0" placeholder="Enter fare paid" required>
            </div>

            <div class="form-group">
                <label for="embarked">Embarked:</label>
                <select id="embarked" name="embarked" required>
                    <option value="">Select port</option>
                    <option value="C">Cherbourg</option>
                    <option value="Q">Queenstown</option>
                    <option value="S">Southampton</option>
                </select>
            </div>

            <button type="submit">Predict</button>
        </form>

        <!-- Result Display -->
        <div id="result" class="result-text" aria-live="polite"></div>

        <!-- Audio -->
        <audio id="result-sound" src="{{ url_for('static', filename='success-sound.mp3') }}" preload="auto"></audio>

        <!-- Confetti Canvas -->
        <canvas id="confetti-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999;"></canvas>

        <!-- Script for result & effects -->
        <script>
            function showResult(text, survived = false) {
                const resultDiv = document.getElementById('result');
                const sound = document.getElementById('result-sound');
                resultDiv.textContent = text;
                resultDiv.className = 'result-text ' + (survived ? 'survived' : 'not-survived');
                resultDiv.style.animation = 'fadeInResult 0.8s ease forwards';

                sound.currentTime = 0;
                sound.play();

                if (survived) launchConfetti();
            }

            function launchConfetti() {
                const canvas = document.getElementById('confetti-canvas');
                const ctx = canvas.getContext('2d');
                const pieces = [];
                const colors = ['#00ff00', '#ffffff', '#33cc33'];
                const w = canvas.width = window.innerWidth;
                const h = canvas.height = window.innerHeight;

                for (let i = 0; i < 100; i++) {
                    pieces.push({
                        x: Math.random() * w,
                        y: Math.random() * h - h,
                        size: Math.random() * 8 + 2,
                        speed: Math.random() * 3 + 2,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        angle: Math.random() * Math.PI * 2
                    });
                }

                let animationId;
                function draw() {
                    ctx.clearRect(0, 0, w, h);
                    pieces.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, 2 * Math.PI);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                        p.y += p.speed;
                        p.x += Math.sin(p.angle) * 2;
                        p.angle += 0.02;
                        if (p.y > h) p.y = -10;
                    });
                    animationId = requestAnimationFrame(draw);
                }

                draw();

                setTimeout(() => {
                    cancelAnimationFrame(animationId);
                    ctx.clearRect(0, 0, w, h);
                }, 5000);
            }

            // Automatically show result from Flask
            const prediction = "{{ prediction | default('') | safe }}".toLowerCase();
            if (prediction === "survived") {
                showResult("Survived!", true);
            } else if (prediction === "did not survive") {
                showResult("Did not survive", false);
            }
        </script>
    </div>
</body>

</html>
